 <path d="M-28-15-4-2V31" stroke="#c1f5dc" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
 <path d="M0 0v38" stroke="#9be0c2" stroke-opacity=".45"/>
</g>
<!-- Continuous joints are solved from the wrist pose every frame. -->
<g id="robot-links" stroke-linecap="round" stroke-linejoin="round" filter="url(#arm-shadow)">
 <use href="#upper-arm-path" stroke="#68828b" stroke-width="38"/>
 <use href="#upper-arm-path" stroke="url(#arm-metal)" stroke-width="32"/>
 <use href="#upper-arm-path" stroke="#f8ffff" stroke-opacity=".6" stroke-width="5" transform="translate(-5 -3)"/>
 <circle cx="170" cy="327" r="26" fill="#2b424c" stroke="#9bb3b7" stroke-width="3"/>
 <circle cx="170" cy="327" r="15" fill="#617b82"/>
 <circle cx="170" cy="327" r="7" fill="#addbcf"/>
 <use href="#forearm-path" stroke="#5e7982" stroke-width="32"/>
 <use href="#forearm-path" stroke="url(#arm-metal-light)" stroke-width="26"/>
 <use href="#forearm-path" stroke="#f7fffc" stroke-opacity=".8" stroke-width="4" transform="translate(-3 -3)"/>
 <g id="robot-elbow" transform="translate(165.58 162.059)">
  <circle r="25" fill="#344e58" stroke="#b5cece" stroke-width="3"/>
  <circle r="15" fill="#7e9ba0"/><circle r="7" fill="#d6efe7"/>
  <circle r="19" stroke="#a8d9d0" stroke-opacity=".4" stroke-width="1"/>
 </g>
</g>
<g id="robot-gripper" transform="translate(338 192)">
 <circle r="19" fill="#3c5963" stroke="#bacfce" stroke-width="3"/>
 <circle r="9" fill="#b7d0d0"/>
 <path d="M-25 9h50v17h-50Z" fill="#abc4c5"/>
 <rect x="-51" y="18" width="102" height="20" rx="6" fill="#4c6872" stroke="#a0bec0"/>
