<!-- The target remains attached to the fingers while being carried. -->
<g id="grasp-object" transform="translate(385 350)">
 <path d="m-32-18 32-18 32 18-32 18Z" fill="#abefd2" stroke="#b8f9e1" stroke-width=".7"/>
