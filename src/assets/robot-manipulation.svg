  <path d="m327 228 17-7 20 10-18 8Z" fill="#637d78"/>
  <path d="m327 228 19 11v14l-19-10Z" fill="#527b7b"/>
  <path d="m346 239 18-8v14l-18 8Z" fill="#709b93"/>
