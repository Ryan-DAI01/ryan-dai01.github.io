<svg xmlns="http://www.w3.org/2000/svg" id="grasp-scene" viewBox="0 0 600 520" fill="none" role="img" aria-labelledby="hero-art-title hero-art-description" data-phase="approach" data-holding="false">
<title id="hero-art-title">A complete robotic pick-and-place sequence</title>
<desc id="hero-art-description">A two-finger gripper approaches a green block, closes around it, lifts it off the table, transfers it to the next position, and releases it after setting it down. Concept illustration.</desc>
<defs>
 <linearGradient id="bench-bg" x1="30" y1="20" x2="560" y2="510" gradientUnits="userSpaceOnUse"><stop stop-color="#122735"/><stop offset="1" stop-color="#0c1a28"/></linearGradient>
 <radialGradient id="bench-halo"><stop stop-color="#5baf9f" stop-opacity=".19"/><stop offset="1" stop-color="#112738" stop-opacity="0"/></radialGradient>
 <linearGradient id="bench-top" x1="130" y1="285" x2="480" y2="445" gradientUnits="userSpaceOnUse"><stop stop-color="#223b48"/><stop offset="1" stop-color="#172c38"/></linearGradient>
 <linearGradient id="arm-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcffff"/><stop offset=".35" stop-color="#dee9e9"/><stop offset=".72" stop-color="#a7bec2"/><stop offset="1" stop-color="#6c898f"/></linearGradient>
 <linearGradient id="arm-metal-light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf6f5"/><stop offset="1" stop-color="#b2c9ca"/></linearGradient>
 <linearGradient id="block-front" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#59bb9d"/><stop offset="1" stop-color="#86ddbe"/></linearGradient>
 <linearGradient id="block-side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#448f81"/><stop offset="1" stop-color="#286c64"/></linearGradient>
 <filter id="bench-shadow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="arm-shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="4" dy="7" stdDeviation="4" flood-color="#000813" flood-opacity=".35"/></filter>
 <path id="upper-arm-path" d="M170 327 L165.58 162.059"/>
 <path id="forearm-path" d="M165.58 162.059 L338 192"/>
</defs>
<rect x="12" y="12" width="576" height="496" rx="24" fill="url(#bench-bg)" stroke="#35525c"/>
<ellipse cx="325" cy="242" rx="250" ry="216" fill="url(#bench-halo)"/>
<g stroke="#598277" opacity=".16">
 <path d="M44 92H556M44 132H556M44 172H556M44 212H556"/>
