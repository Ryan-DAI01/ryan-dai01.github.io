<svg xmlns="http://www.w3.org/2000/svg" id="grasp-scene" viewBox="0 0 600 560" fill="none" role="img" aria-labelledby="hero-art-title hero-art-description" data-phase="approach" data-holding="false">
<title id="hero-art-title">Robotic manipulation in a cluttered, stacked scene</title>
<desc id="hero-art-description">A robot sorts three colored blocks from a stack surrounded by boxes, cylinders, and scattered parts. It identifies the top object, closes its fingers, lifts above the clutter, and releases the object into a separate tray. Objects stay where they are placed. The return sequence rebuilds the stack for a seamless loop. Concept illustration.</desc>
