 <rect x="-10" y="25" width="20" height="5" rx="2.5" fill="#9cf1cc"/>
 <g id="left-jaw" transform="translate(-49 0)">
  <path d="M-9 35H3v9H0v52H-8V44H-9Z" fill="#bdd0cf" stroke="#e3efea" stroke-width=".6"/>
  <rect x="0" y="66" width="4" height="30" rx="1.5" fill="#34565a"/>
 </g>
 <g id="right-jaw" transform="translate(49 0)">
  <path d="M-3 35H9v9H8v52H0V44H-3Z" fill="#a6bfc1" stroke="#d9e8e7" stroke-width=".6"/>
  <rect x="-4" y="66" width="4" height="30" rx="1.5" fill="#34565a"/>
 </g>
</g>
