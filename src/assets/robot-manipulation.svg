<g stroke="#51736e" stroke-width=".8" opacity=".27"><path d="M111.875 345.875 L383.125 445.75"/><path d="M123.75 367.5 L300 294.375"/><path d="M133.75 336.75 L406.25 436.5"/><path d="M157.5 380 L335 306.75"/><path d="M155.625 327.625 L429.375 427.25"/><path d="M191.25 392.5 L370 319.125"/><path d="M177.5 318.5 L452.5 418"/><path d="M225 405 L405 331.5"/><path d="M199.375 309.375 L475.625 408.75"/><path d="M258.75 417.5 L440 343.875"/><path d="M221.25 300.25 L498.75 399.5"/><path d="M292.5 430 L475 356.25"/><path d="M243.125 291.125 L521.875 390.25"/><path d="M326.25 442.5 L510 368.625"/></g>
<ellipse cx="385" cy="394" rx="44" ry="17" fill="#7de4bd" fill-opacity=".035" stroke="#729e8c" stroke-width="1.3" stroke-dasharray="3 5"/>
<ellipse cx="455" cy="394" rx="44" ry="17" fill="#94bfff" fill-opacity=".035" stroke="#6c8caa" stroke-width="1.3" stroke-dasharray="3 5"/>
<ellipse id="object-shadow" cx="385" cy="394" rx="36" ry="11" fill="#020e17" opacity=".43"/>
<!-- Robot pedestal. -->
<ellipse cx="170" cy="398" rx="61" ry="20" fill="#040e16" opacity=".4"/>
<path d="M124 373v17c0 25 92 25 92 0v-17Z" fill="#47616b"/>
