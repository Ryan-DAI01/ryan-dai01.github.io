<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" fill="none" role="img" aria-labelledby="hero-art-title hero-art-description">
<title id="hero-art-title">From language and perception to robotic action</title>
<desc id="hero-art-description">A sculptural robot arm reaches toward a green mug, surrounded by a camera view, a language instruction, and a planned grasp trajectory.</desc>
<defs>
  <linearGradient id="bg" x1="38" y1="20" x2="552" y2="498" gradientUnits="userSpaceOnUse"><stop stop-color="#142c39"/><stop offset=".52" stop-color="#10232f"/><stop offset="1" stop-color="#163335"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#7de6cf" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#f9fbf9"/><stop offset=".4" stop-color="#d8e1e0"/><stop offset="1" stop-color="#8d9d9f"/></linearGradient>
  <linearGradient id="metal2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9f6"/><stop offset=".45" stop-color="#dde5e1"/><stop offset="1" stop-color="#b1c0bb"/></linearGradient>
  <linearGradient id="mug" x1="304" y1="280" x2="383" y2="305" gradientUnits="userSpaceOnUse"><stop stop-color="#599b83"/><stop offset=".48" stop-color="#75b19a"/><stop offset="1" stop-color="#307461"/></linearGradient>
  <linearGradient id="link" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#354653"/><stop offset="1" stop-color="#1f333e"/></linearGradient>
  <linearGradient id="block" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2a589"/><stop offset="1" stop-color="#a67457"/></linearGradient>
  <filter id="soft" x="-40%" y="-50%" width="180%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#254337" flood-opacity=".10"/></filter>
  <filter id="cardshadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#344b42" flood-opacity=".07"/></filter>
  <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#80978e" opacity=".26"/></pattern>
  <clipPath id="frame"><rect x="22" y="18" width="556" height="474" rx="24"/></clipPath>
  <marker id="arrow" viewBox="0 0 6 6" refX="4" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 5 3-5 3" fill="none" stroke="#548b75" stroke-width="1.2"/></marker>
</defs>
