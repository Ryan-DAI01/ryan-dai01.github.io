  <path d="M346 253v18" stroke="#4f8d72" stroke-width="1.5" stroke-dasharray="3 4"/>
  </g>
  </g>
  <!-- A planned observation-to-action trajectory. -->
  <path class="scene-path" d="M452 215C455 170 390 150 359 184" stroke="#91efd0" stroke-width="1.7" stroke-dasharray="4 6" marker-end="url(#arrow)"/>
  <circle cx="452" cy="215" r="4" fill="#91efd0"/>
  <!-- Language instruction. -->
  <g class="instruction-window" filter="url(#cardshadow)">
    <rect x="56" y="56" width="250" height="43" rx="12" fill="#122c3a" fill-opacity=".98" stroke="#598e7d"/>
